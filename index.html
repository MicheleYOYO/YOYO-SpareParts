<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>YOYO UNIQUE SPARE PARTS CATALOGUE</title>

<style>
body{font-family:Arial;margin:20px;}
input,button{padding:6px;font-size:16px;}
table{border-collapse:collapse;width:100%;margin-top:20px;}
th,td{border:1px solid #333;padding:8px;}
th{background:#eee;}
#partsBox table tr:hover td{background-color:#f0f0f0;}
#partsBox table tr:hover{cursor:pointer;}
</style>
</head>

<body>

<h1>YOYO UNIQUE SPARE PARTS CATALOGUE</h1>

<!-- VIN -->
<h2>Identificazione modello tramite VIN</h2>
<p>Inserisci le ultime 6 cifre del VIN:</p>
<input type="text" id="vinInput" maxlength="6">
<button onclick="identificaModello()">Identifica</button>
<p id="risultatoVIN" style="font-weight:bold;margin-top:10px;"></p>
<hr>

<!-- Ricerca -->
<h2>Ricerca ricambi</h2>
<input type="text" id="searchInput" placeholder="Cerca ricambio per codice o nome" oninput="mostraRicambi()">
<br><br>
<button onclick="mostraSinottici()">🔍 Ricerca visuale</button>
<button onclick="tornaAllaHome()">🏠 Torna alla pagina iniziale</button>
<hr>

<h2>Catalogo Ricambi</h2>
<div id="partsBox"></div>

<script>
/* ================= VIN ================= */
let vinTable=[];
let modelloCorrente="";

const VIN_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/VIN.csv";

async function caricaVIN(){
    const r=await fetch(VIN_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const [start,end,modello]=righe[i].split(",");
        vinTable.push({
            start:parseInt(start.trim()),
            end:parseInt(end.trim()),
            modello:modello.trim()
        });
    }
}
caricaVIN();

function identificaModello(){
    const vin=document.getElementById("vinInput").value.trim();
    if(!vin){
        modelloCorrente="";
        document.getElementById("risultatoVIN").innerText="Inserisci un VIN valido";
        mostraRicambi();
        return;
    }

    const vinNum=parseInt(vin);
    modelloCorrente="";

    for(let r of vinTable){
        if(vinNum>=r.start && vinNum<=r.end){
            modelloCorrente=r.modello.trim();
            break;
        }
    }

    if(!modelloCorrente)
        document.getElementById("risultatoVIN").innerText="VIN non trovato nei range";
    else
        document.getElementById("risultatoVIN").innerText="Modello identificato: "+modelloCorrente;

    mostraRicambi();
}

/* ================= PARTS ================= */
let partsTableMY22=[];
let partsTableMY2205=[];
let partsTableMY23=[];
let partsTableMY24=[];

async function caricaCSV(url, target){
    try{
        const r=await fetch(url);
        if(!r.ok) return;
        const t=await r.text();
        const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

        for(let i=1;i<righe.length;i++){
            const cols=righe[i].split(",");
            target.push({
                codice:cols[0]?.trim()||"",
                descrizione:cols[1]?.trim()||"",
                quantita:cols[2]?.trim()||"",
                id:(cols[3]||"").trim(),
                esploso:(cols[4]||"").trim()
            });
        }
    }catch(e){}
}

caricaCSV("https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY22.csv", partsTableMY22);
caricaCSV("https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY2205.csv", partsTableMY2205);
caricaCSV("https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY23.csv", partsTableMY23);
caricaCSV("https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY24.csv", partsTableMY24);

/* ================= MODEL MAP ================= */
const MODEL_MAP={
    "Y01":"MY22",
    "Y0105":"MY2205",
    "Y0210":"MY23",
    "Y0230":"MY24"
};

function getTabellaModello(){
    if(modelloCorrente==="Y01") return partsTableMY22;
    if(modelloCorrente==="Y0105") return partsTableMY2205;
    if(modelloCorrente==="Y0210") return partsTableMY23;
    if(modelloCorrente==="Y0230") return partsTableMY24;
    return [];
}

/* ================= COORDINATE ================= */
async function caricaCoordinate(file){
    const cartella=MODEL_MAP[modelloCorrente];
    if(!cartella) return {};

    const url=`https://micheleyoyo.github.io/YOYO-SpareParts/coords/${cartella}/${file}.json`;

    try{
        const r=await fetch(url);
        if(!r.ok) return {};
        return await r.json();
    }catch(e){
        return {};
    }
}

/* ================= MOSTRA RICAMBI ================= */
function mostraRicambi(){
    const search=(document.getElementById("searchInput").value||"").toLowerCase().trim();
    const tabella=getTabellaModello();

    let html="<table><tr><th>Codice</th><th>Descrizione</th><th>Quantità</th><th>Modelli</th></tr>";

    const filtrati=tabella.filter(p=>{
        if(!search) return true;
        return p.codice.toLowerCase().includes(search) ||
               p.descrizione.toLowerCase().includes(search);
    });

    filtrati.forEach(p=>{
        html+=`
        <tr data-id="${p.id}" onclick="mostraEsploso('${p.esploso}','${p.codice}','${p.id}')">
            <td>${p.codice}</td>
            <td>${p.descrizione}</td>
            <td>${p.quantita}</td>
            <td>${MODEL_MAP[modelloCorrente]||""}</td>
        </tr>`;
    });

    if(filtrati.length===0)
        html+="<tr><td colspan='4'>Nessun ricambio trovato</td></tr>";

    html+="</table>";
    document.getElementById("partsBox").innerHTML=html;
}

/* ================= RICERCA VISUALE ================= */
function mostraSinottici(){
    if(!modelloCorrente){
        document.getElementById("partsBox").innerHTML=`
            <h3>Seleziona il modello</h3>
            <button onclick="selezionaModelloVisuale('Y01')">MY22</button>
            <button onclick="selezionaModelloVisuale('Y0105')">MY2205</button>
            <button onclick="selezionaModelloVisuale('Y0210')">MY23</button>
            <button onclick="selezionaModelloVisuale('Y0230')">MY24</button>
        `;
        return;
    }
    mostraSinotticiPerModello(modelloCorrente);
}

function selezionaModelloVisuale(m){
    modelloCorrente=m;
    mostraSinotticiPerModello(m);
}

function mostraSinotticiPerModello(m){
    const tabella=getTabellaModello();
    const cartella=MODEL_MAP[m];

    const sinottici=[...new Set(tabella.map(p=>p.esploso.trim()).filter(x=>x))];

    let html="<h3>Seleziona un sinottico</h3><div style='display:flex;flex-wrap:wrap;gap:20px;'>";

    sinottici.forEach(s=>{
        html+=`
        <div onclick="mostraRicambiSinottico('${s}')" 
             style="border:1px solid #333;padding:15px;width:45%;cursor:pointer;">
            <img src="https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${cartella}/${s}.jpg"
                 style="width:100%;height:auto;">
            <div style="margin-top:10px;font-weight:bold;font-size:22px;">${s}</div>
        </div>`;
    });

    html+="</div>";
    document.getElementById("partsBox").innerHTML=html;
}

/* ================= RICAMBI DI UN SINOTTICO ================= */
function mostraRicambiSinottico(expl){
    const tabella=getTabellaModello();
    const ricambi=tabella.filter(p=>p.esploso===expl);

    let html=`<h2>Ricambi del sinottico ${expl}</h2>`;
    html+="<table><tr><th>Codice</th><th>Descrizione</th><th>Quantità</th></tr>";

    ricambi.forEach(p=>{
        html+=`
        <tr data-id="${p.id}" onclick="mostraEsploso('${p.esploso}','${p.codice}','${p.id}')">
            <td>${p.codice}</td>
            <td>${p.descrizione}</td>
            <td>${p.quantita}</td>
        </tr>`;
    });

    if(ricambi.length===0)
        html+="<tr><td colspan='3'>Nessun ricambio trovato</td></tr>";

    html+="</table>";
    document.getElementById("partsBox").innerHTML=html;
}

/* ================= MOSTRA ESPLOSO ================= */
async function mostraEsploso(file, codice, idRicambio){
    if(!file){ alert("Nessun esploso disponibile"); return; }

    const coords = await caricaCoordinate(file);
    const cartella = MODEL_MAP[modelloCorrente];
    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${cartella}/${file}.jpg`;

    const win = window.open("", "_blank");

    win.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>${codice}</title>
<style>
body{
    margin:0;
    padding:20px;
    background:#000;
    font-family:Arial;
}
#container{
    position:relative;
    display:inline-block;
}
#explodedImg{
    width:60%;     /* <<< stessa scala del mapper */
    height:auto;
    display:block;
}
.marker{
    position:absolute;
    width:25px;
    height:25px;
    background:rgba(255,255,0,0.7);
    border:2px solid #000;
    border-radius:50%;
    transform:translate(-50%,-50%);
    cursor:pointer;
}
</style>
</head>
<body>

<div id="container">
    <img id="explodedImg" src="${url}">
</div>

<script>
const coords = ${JSON.stringify(coords)};
const fileName = "${file}".replace(/\\.[^/.]+$/, "");
const selectedId = "${idRicambio}";

const img = document.getElementById("explodedImg");
const container = document.getElementById("container");

img.onload = function(){
    requestAnimationFrame(()=>{

        const displayedW = img.clientWidth;
        const displayedH = img.clientHeight;

        if(coords[fileName]){
            let keys = selectedId ? selectedId.split("-") : Object.keys(coords[fileName]);

            keys.forEach(id=>{
                if(!coords[fileName][id]) return;

                coords[fileName][id].forEach(pt=>{
                    const m = document.createElement("div");
                    m.className = "marker";

                    // DE-NORMALIZZAZIONE
                    m.style.left = (pt.x * displayedW) + "px";
                    m.style.top  = (pt.y * displayedH) + "px";

                    m.onclick = () => {
                        if(window.opener && !window.opener.closed){
                            window.opener.selezionaRicambioDaMarker(fileName, id);
                        }
                        window.close();
                    };

                    container.appendChild(m);
                });
            });
        }
    });
};
<\/script>

</body>
</html>
`);
}




/* ================= EVIDENZIAZIONE ================= */
function selezionaRicambioDaMarker(expl,idRicambio){
    mostraRicambiSinottico(expl);

    setTimeout(()=>{
        const righe=document.querySelectorAll("#partsBox table tr");

        righe.forEach(r=>{
            r.style.background="";
            if(r.getAttribute("data-id")===idRicambio){
                r.style.background="#ffff66";
                r.scrollIntoView({behavior:"smooth",block:"center"});
            }
        });
    },200);
}

/* ================= HOME ================= */
function tornaAllaHome(){
    document.getElementById("vinInput").value="";
    document.getElementById("searchInput").value="";
    modelloCorrente="";
    document.getElementById("risultatoVIN").innerText="";
    document.getElementById("partsBox").innerHTML="";
}
</script>

</body>
</html>
