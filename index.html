<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOYO Spare Parts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        input, button { padding: 10px; font-size: 16px; }
        #results img { width: 180px; margin: 10px; cursor: pointer; border: 1px solid #ccc; }
        .exploded-img { width: 45%; margin: 10px; cursor: pointer; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>

<h1>YOYO Spare Parts</h1>

<h2>Ricerca per VIN</h2>
<input type="text" id="vinInput" placeholder="Inserisci VIN">
<button onclick="cercaVIN()">Cerca</button>

<h2>Ricerca Visuale</h2>
<button onclick="mostraSinottici()">Mostra esplosi modello</button>

<div id="results"></div>
<div id="parts"></div>

<script>
let modello = "";
let csvData = [];

/* ------------------------------
   1. Determina modello dal VIN
--------------------------------*/
function cercaVIN() {
    const vin = document.getElementById("vinInput").value.trim().toUpperCase();

    if (vin.length < 10) {
        alert("VIN non valido");
        return;
    }

    const codice = vin.substring(3, 7);

    if (codice === "Y01") modello = "Y01";
    else if (codice === "Y023") modello = "Y0230";
    else modello = "GENERIC";

    caricaCSV();
}

/* ------------------------------
   2. Carica CSV corretto
--------------------------------*/
function caricaCSV() {
    let url = "";

    if (modello === "Y01") {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/partsMY22.csv";
    } else if (modello === "Y0230") {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/partsMY24.csv";
    } else {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/parts.csv";
    }

    fetch(url)
        .then(response => response.text())
        .then(text => {
            csvData = parseCSV(text);
            mostraRicambi();
        });
}

/* ------------------------------
   3. Parser CSV
--------------------------------*/
function parseCSV(text) {
    const righe = text.split("\n");
    return righe.map(r => r.split(";"));
}

/* ------------------------------
   4. Mostra ricambi del modello
--------------------------------*/
function mostraRicambi() {
    let html = "<h2>Ricambi</h2><table><tr><th>Codice</th><th>Descrizione</th><th>Esploso</th></tr>";

    csvData.forEach(r => {
        if (r.length > 4) {
            const esploso = r[4].trim();
            html += `<tr>
                        <td>${r[0]}</td>
                        <td>${r[1]}</td>
                        <td><button onclick="apriEsploso('${esploso}')">${esploso}</button></td>
                     </tr>`;
        }
    });

    html += "</table>";
    document.getElementById("parts").innerHTML = html;
}

/* ------------------------------
   5. Apri immagine esploso
--------------------------------*/
function apriEsploso(code) {
    let folder = modello === "Y0230" ? "MY24" : modello;

    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${folder}/${code}.jpg`;

    window.open(url, "_blank");
}

/* ------------------------------
   6. Ricerca visuale: mostra tutti gli esplosi
--------------------------------*/
function mostraSinottici() {
    if (!modello) {
        alert("Prima inserisci un VIN");
        return;
    }

    let folder = modello === "Y0230" ? "MY24" : modello;

    let html = "<h2>Esplosi disponibili</h2>";

    for (let i = 1; i <= 99; i++) {
        let code = "";

        if (modello === "Y0230") {
            code = "Y0230" + String(i).padStart(3, "0");
        } else {
            code = modello + String(i).padStart(2, "0");
        }

        html += `<img class="exploded-img" src="https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${folder}/${code}.jpg"
                 onclick="apriEsploso('${code}')">`;
    }

    document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
