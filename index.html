<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>YOYO Spare Parts</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        tr:hover { background: #eef; cursor: pointer; }
        #explodedView img { max-width: 100%; border: 1px solid #333; padding: 10px; }
    </style>
</head>

<body>

<h2>Catalogo Ricambi YOYO</h2>

<label>Inserisci VIN:</label>
<input type="text" id="vinInput">
<button onclick="cercaVIN()">Cerca</button>

<div id="vinResult"></div>
<div id="partsBox"></div>
<div id="explodedView" style="margin-top:20px;"></div>

<script>
let partsTable = [];
let vinTable = [];
let modelloCorrente = "";

/* ------------------------------
   1. CARICA VIN.csv (VIRGOLE)
--------------------------------*/
fetch("VIN.csv")
    .then(res => res.text())
    .then(text => {
        const righe = text.split("\n").slice(1);

        vinTable = righe
            .map(r => r.trim())
            .filter(r => r.length > 0)
            .map(r => {
                const c = r.split(",");   // CSV A VIRGOLE

                return {
                    start: parseInt(c[0]),
                    end: parseInt(c[1]),
                    modello: c[2].trim()
                };
            });
    });

/* ------------------------------
   2. CARICA PARTS.csv (VIRGOLE)
--------------------------------*/
fetch("Parts.csv")
    .then(res => res.text())
    .then(text => {
        const righe = text.split("\n").slice(1);

        partsTable = righe
            .map(r => r.trim())
            .filter(r => r.length > 0)
            .map(r => {
                const c = r.split(",");

                return {
                    codice: c[0],
                    descrizione: c[1],
                    quantita: c[2],
                    modello: c[3],
                    esploso: c[4] ? c[4].trim() : ""
                };
            });
    });

/* ------------------------------
   3. CERCA VIN → TROVA MODELLO
--------------------------------*/
function cercaVIN() {
    const vin = document.getElementById("vinInput").value.trim();

    if (vin.length < 6) {
        document.getElementById("vinResult").innerHTML = "<p>Inserisci almeno le ultime 6 cifre.</p>";
        return;
    }

    const ultimi6 = parseInt(vin.slice(-6));

    const trovato = vinTable.find(r => ultimi6 >= r.start && ultimi6 <= r.end);

    if (!trovato) {
        document.getElementById("vinResult").innerHTML = "<p>Modello non trovato.</p>";
        return;
    }

    modelloCorrente = trovato.modello;

    document.getElementById("vinResult").innerHTML =
        `<p>Modello rilevato: <b>${modelloCorrente}</b></p>`;

    mostraRicambi();
}

/* ------------------------------
   4. MOSTRA RICAMBI DEL MODELLO
--------------------------------*/
function mostraRicambi() {
    const lista = partsTable.filter(p =>
        p.modello
            .replace(/\*/g, "")
            .replace(/\s+/g, " ")
            .split("|")
            .includes(modelloCorrente)
    );

    if (lista.length === 0) {
        document.getElementById("partsBox").innerHTML =
            "<p>Nessun ricambio trovato per questo modello.</p>";
        return;
    }

    let html = "<table><tr><th>Codice</th><th>Descrizione</th><th>Q.tà</th><th>Modello</th></tr>";

    lista.forEach(p => {
        html += `
            <tr onclick="mostraEsploso('${p.esploso}', '${p.codice}')">
                <td>${p.codice}</td>
                <td>${p.descrizione}</td>
                <td>${p.quantita}</td>
                <td>${p.modello}</td>
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("partsBox").innerHTML = html;
}

/* ------------------------------
   5. MOSTRA ESPLOSO
--------------------------------*/
function mostraEsploso(file, codice) {

    if (!file) {
        document.getElementById("explodedView").innerHTML =
            "<p>Nessun esploso disponibile per questo ricambio.</p>";
        return;
    }

    const percorso = `esplosi/${file}.png`;

    document.getElementById("explodedView").innerHTML = `
        <h3>Esploso del ricambio: ${codice}</h3>
        <img src="${percorso}">
    `;

    evidenziaRiga(codice);
}

/* ------------------------------
   6. EVIDENZIA RIGA
--------------------------------*/
function evidenziaRiga(codice) {
    const righe = document.querySelectorAll("#partsBox table tr");

    righe.forEach(r => r.style.background = "white");

    righe.forEach(r => {
        if (r.innerText.includes(codice)) {
            r.style.background = "#ffff99";
        }
    });
}
</script>

</body>
</html>
