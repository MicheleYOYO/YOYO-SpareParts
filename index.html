<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOYO Spare Parts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        input, button { padding: 10px; font-size: 16px; }
        #results img { width: 180px; margin: 10px; cursor: pointer; border: 1px solid #ccc; }
        .exploded-img { width: 45%; margin: 10px; cursor: pointer; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>

<h1>YOYO Spare Parts</h1>

<h2>Ricerca per VIN (ultime 6 cifre)</h2>
<input type="text" id="vinInput" placeholder="Inserisci ultime 6 cifre">
<button onclick="cercaVIN()">Cerca</button>

<h2>Ricerca Visuale</h2>
<button onclick="mostraSinottici()">Mostra esplosi modello</button>

<div id="results"></div>
<div id="parts"></div>

<script>
let modello = "";
let csvData = [];

/* ---------------------------------------------------
   1. RICERCA VIN: ultime 6 cifre + confronto VIN.csv
--------------------------------------------------- */
function cercaVIN() {
    const vin6 = document.getElementById("vinInput").value.trim();

    if (vin6.length !== 6 || isNaN(vin6)) {
        alert("Inserisci le ultime 6 cifre del VIN");
        return;
    }

    fetch("https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/VIN.csv")
        .then(response => response.text())
        .then(text => {
            const righe = text.split("\n");
            let trovato = false;

            righe.forEach(r => {
                const campi = r.split(",");   // <-- CORRETTO: VIN.csv usa la virgola

                if (campi.length < 3) return;

                const start = campi[0].trim();
                const end = campi[1].trim();
                const model = campi[2].trim();

                if (vin6 >= start && vin6 <= end) {
                    modello = model;
                    trovato = true;
                }
            });

            if (!trovato) {
                alert("VIN non trovato nei range");
                return;
            }

            caricaCSV();
        });
}

/* ---------------------------------------------------
   2. CARICA CSV DEL MODELLO
--------------------------------------------------- */
function caricaCSV() {
    let url = "";

    if (modello === "Y01") {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/partsMY22.csv";
    } 
    else if (modello === "Y0230") {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/partsMY24.csv";
    }
    else {
        url = "https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/main/parts.csv";
    }

    fetch(url)
        .then(response => response.text())
        .then(text => {
            csvData = parseCSV(text);
            mostraRicambi();
        });
}

/* ---------------------------------------------------
   3. PARSER CSV
--------------------------------------------------- */
function parseCSV(text) {
    const righe = text.split("\n");
    return righe.map(r => r.split(";"));
}

/* ---------------------------------------------------
   4. MOSTRA RICAMBI DEL MODELLO
--------------------------------------------------- */
function mostraRicambi() {
    let html = "<h2>Ricambi</h2><table><tr><th>Codice</th><th>Descrizione</th><th>Esploso</th></tr>";

    csvData.forEach(r => {
        if (r.length > 4) {
            const esploso = r[4].trim();
            html += `<tr>
                        <td>${r[0]}</td>
                        <td>${r[1]}</td>
                        <td><button onclick="apriEsploso('${esploso}')">${esploso}</button></td>
                     </tr>`;
        }
    });

    html += "</table>";
    document.getElementById("parts").innerHTML = html;
}

/* ---------------------------------------------------
   5. APRI IMMAGINE ESPLOSO
--------------------------------------------------- */
function apriEsploso(code) {
    let folder = modello === "Y0230" ? "MY24" : modello;
    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${folder}/${code}.jpg`;
    window.open(url, "_blank");
}

/* ---------------------------------------------------
   6. RICERCA VISUALE: mostra tutti gli esplosi
--------------------------------------------------- */
function mostraSinottici() {
    if (!modello) {
        alert("Prima fai la ricerca VIN");
        return;
    }

    let folder = modello === "Y0230" ? "MY24" : modello;
    let html = "<h2>Esplosi disponibili</h2>";

    for (let i = 1; i <= 99; i++) {
        let code = "";

        if (modello === "Y0230") {
            code = "Y0230" + String(i).padStart(3, "0"); // Y02300001
        } else {
            code = modello + String(i).padStart(2, "0"); // Y0101
        }

        html += `<img class="exploded-img" 
                     src="https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${folder}/${code}.jpg"
                     onclick="apriEsploso('${code}')">`;
    }

    document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
