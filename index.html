    else if(modelloCorrente==="Y0230") tabella=partsTableMY24;

    const filtrati=tabella.filter(p=>{
        if(search.length>0){
            const codice=p.codice.toLowerCase();
            const descrizione=p.descrizione.toLowerCase();

        html+=`

/* ---------------- CERCHI + TOOLTIP + AGGIUNTA ALLA LISTA ---------------- */
async function inizializzaMiniaturaSinottico(sinottico){
    const coords = await caricaCoordinate(sinottico);
    if(!coords || !coords[sinottico]) return;

    const img = document.getElementById("img-"+sinottico);
    if(!img) return;

    const container = document.getElementById("box-"+sinottico);
    if(!container) return;

    const ricambi = partsTableMY22
        .concat(partsTableMY2205)
        .concat(partsTableMY23)
        .concat(partsTableMY24);

    function disegna(){
        const displayedW = img.clientWidth;
        const displayedH = img.clientHeight;

        Object.keys(coords[sinottico]).forEach(id=>{
            const ricambio = ricambi.find(r => r.esploso === sinottico && r.id == id);

            coords[sinottico][id].forEach(pt=>{
                const m = document.createElement("div");
                m.className = "markerMini";

                /* Tooltip principale */
                const tip = document.createElement("div");
                tip.className = "tooltip";
                tip.textContent = ricambio
                    ? (ricambio.codice + " – " + ricambio.descrizione)
                    : ("ID " + id);
                m.appendChild(tip);

                /* Tooltip aggiuntivo giallo */
                const add = document.createElement("div");
                add.className = "tooltipAdd";
                add.textContent = "➕ Aggiungi alla lista";
                add.onclick = (ev)=>{
                    ev.stopPropagation();
                    if(ricambio){
                        aggiungiALista(ricambio.codice, ricambio.descrizione, 1);
                    }
                };
                m.appendChild(add);

                /* Hover */
                m.onmouseenter = () => {
                    tip.style.opacity = 1;
                    add.style.opacity = 1;
                };
                m.onmouseleave = () => {
                    tip.style.opacity = 0;
                    add.style.opacity = 0;
                };

                /* Posizione */
                m.style.left = (pt.x * displayedW) + "px";
                m.style.top  = (pt.y * displayedH) + "px";

                /* Click → comportamento attuale */
                m.onclick = () => {
                    mostraEsploso(sinottico, ricambio ? ricambio.codice : sinottico, id);
                };

                container.appendChild(m);
            });
        });
    }

    if(img.complete){
        disegna();
    }else{
        img.onload = disegna;
    }
}

            <td onclick="mostraEsploso('${p.esploso}','${p.codice}','${p.id}')">${p.quantita}</td>

    html += "</table>";
    document.getElementById("partsBox").innerHTML = html;

    if(evidenziaId){

                    r.style.background="#ffff66";
                    r.scrollIntoView({behavior:"smooth",block:"center"});
                }
            });

    }
}

    transform:translate(-50%, 0);
    transition:opacity 0.15s;
    border:1px solid #333;
    cursor:pointer;
}
</style>
</head>

<body>

<button onclick="if(window.opener){window.opener.tornaAGrigliaSinottici();} window.close();"
        style="padding:10px 20px;font-size:18px;margin-bottom:20px;">
    🔙 Torna alla griglia
</button>

<div id="container">
    <img id="explodedImg" src="${url}">
</div>

<script>
const coords = ${JSON.stringify(coords)};
const fileName = "${file}".replace(/\\.[^/.]+$/, "");

const img = document.getElementById("explodedImg");
const container = document.getElementById("container");

const ricambi = ${JSON.stringify(
    partsTableMY22
        .concat(partsTableMY2205)
        .concat(partsTableMY23)
        .concat(partsTableMY24)
)};

img.onload = function(){
    const displayedW = img.clientWidth;
    const displayedH = img.clientHeight;

    if(coords[fileName]){
        Object.keys(coords[fileName]).forEach(id=>{
            const ricambio = ricambi.find(r => r.esploso === fileName && r.id == id);

            coords[fileName][id].forEach(pt=>{
                const m = document.createElement("div");
                m.className = "marker";

                const tip = document.createElement("div");
                tip.className = "tooltip";
                tip.textContent = ricambio 
                    ? (ricambio.codice + " – " + ricambio.descrizione)
                    : ("ID " + id);
                m.appendChild(tip);

                const add = document.createElement("div");
                add.className = "tooltipAdd";
                add.textContent = "➕ Aggiungi alla lista";
                add.onclick = (ev)=>{
                    ev.stopPropagation();
                    if(ricambio){
                        window.opener.aggiungiALista(ricambio.codice, ricambio.descrizione, 1);
                    }
                };
                m.appendChild(add);

                m.onmouseenter = () => {
                    tip.style.opacity = 1;
                    add.style.opacity = 1;
                };
                m.onmouseleave = () => {
                    tip.style.opacity = 0;
                    add.style.opacity = 0;
                };

                m.style.left = (pt.x * displayedW) + "px";
                m.style.top  = (pt.y * displayedH) + "px";

                m.onclick = () => {
                    if(window.opener && !window.opener.closed){
                        window.opener.mostraRicambiSinottico(fileName, id);
                    }
                    window.close();
                };

                container.appendChild(m);
            });
        });
    }
};
<\/script>

</body>
</html>
`);
}
