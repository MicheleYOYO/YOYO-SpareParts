        aggiornaLinguaUI();
    });
}

function aggiornaLinguaUI(){
    // Se sei nella griglia sinottici
    if (document.querySelector('.sinotticoGrid')) {
        mostraSinottici();
        return;
    }

    // Se sei dentro un sinottico aperto
    const titoloSin = document.querySelector('h2');
    if (titoloSin && titoloSin.textContent.includes("Ricambi del sinottico")) {
        const esploso = titoloSin.textContent.replace("Ricambi del sinottico ", "").trim();
        mostraRicambiSinottico(esploso);
        return;
    }

    // Se sei nella tabella ricambi
    if (document.querySelector('#partsBox table')) {
        mostraRicambi();
        return;
    }

    // Se sei nella home
    mostraRicambi();
}


/* ---------------- LISTA RICAMBI ---------------- */
let listaRicambi = [];
let nomeLista = localStorage.getItem("nomeLista") || "";
/* Salva lista + nome lista */
function salvaLista(){
    localStorage.setItem("listaRicambi", JSON.stringify(listaRicambi));
    localStorage.setItem("nomeLista", nomeLista);
}

/* Carica lista + nome lista */
function caricaLista(){
    const data = localStorage.getItem("listaRicambi");
    if(data) listaRicambi = JSON.parse(data);

    nomeLista = localStorage.getItem("nomeLista") || "";
    document.getElementById("nomeListaLabel").textContent = nomeLista;

    renderListaRicambi();
}

/* Aggiungi ricambio */
function aggiungiALista(codice, descrizione, quantita){
    const esiste = listaRicambi.find(x=>x.codice===codice);
    if(esiste){
        esiste.quantita += 1;
    } else {
        listaRicambi.push({ codice, descrizione, quantita:1 });
    }
    salvaLista();
    renderListaRicambi();
}

/* Rimuovi ricambio */
function rimuoviDaLista(codice){
    listaRicambi = listaRicambi.filter(x=>x.codice!==codice);
    salvaLista();
    renderListaRicambi();
}

/* Svuota lista */
function svuotaLista(){
    listaRicambi = [];

    // 🔥 Azzera anche il nome lista (VIN + data + ora)
    nomeLista = "";
    localStorage.removeItem("nomeLista");

    salvaLista();
    renderListaRicambi();

    // 🔥 Aggiorna la label visiva
    document.getElementById("nomeListaLabel").textContent = "";
}

/* Render lista ricambi */
function renderListaRicambi(){
    const box = document.getElementById("listaContenuto");
    const count = document.getElementById("listaCount");
    box.innerHTML = "";

    listaRicambi.forEach(item=>{
        box.innerHTML += `
<div class="listaItem">

    <div class="listaInfo">
        <div class="listaCodice">${item.codice}</div>
        <div class="listaDescrizione">${item.descrizione}</div>
    </div>

    <div class="qtyControls">
        <button class="btnMini" onclick="decrementaDaLista('${item.codice}')">➖</button>
        <span class="qtyValue">${item.quantita}</span>
        <button class="btnMini" onclick="incrementaDaLista('${item.codice}')">➕</button>
    </div>

</div>

        `;
    });

    count.textContent = listaRicambi.length;
}

caricaLista();
function rimuoviDaLista(codice){
    listaRicambi = listaRicambi.filter(x => x.codice !== codice);
    salvaLista();
    renderListaRicambi();
}

function incrementaDaLista(codice){
    const item = listaRicambi.find(x => x.codice === codice);
    if(item){
        item.quantita++;
        salvaLista();
        renderListaRicambi();
    }
}

function decrementaDaLista(codice){
    const item = listaRicambi.find(x => x.codice === codice);
    if(item){
        if(item.quantita > 1){
            item.quantita--;
        } else {
            // se arriva a 0 → rimuoviamo
            listaRicambi = listaRicambi.filter(x => x.codice !== codice);
        }
        salvaLista();
        renderListaRicambi();
    }
}


/* ---------------- ESPORTA CSV ---------------- */
function esportaCSV(){
    let csv = "codice,descrizione,quantita\n";
    listaRicambi.forEach(p=>{
        csv += `${p.codice},${p.descrizione},${p.quantita}\n`;
    });

    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;

    /* Nome file = nome lista */
    a.download = nomeLista ? nomeLista + ".csv" : "lista_ricambi.csv";

    a.click();
    URL.revokeObjectURL(url);
}

/* ---------------- VIN ---------------- */
let vinTable=[]; 
let modelloCorrente="";
const VIN_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/VIN.csv";

async function caricaVIN(){
    const r=await fetch(VIN_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const [start,end,modello]=righe[i].split(",");
        vinTable.push({
            start:parseInt(start.trim()),
            end:parseInt(end.trim()),
            modello:modello.trim()
        });
    }
}
caricaVIN();

/* Identifica modello + genera nome lista */
function identificaModello(){
    const vinInput=document.getElementById("vinInput").value.trim();
    if(!vinInput){
        modelloCorrente="";
        document.getElementById("risultatoVIN").innerText="Inserisci un VIN valido";
        mostraRicambi();
        return;
    }

    const vinNumber=parseInt(vinInput);
    modelloCorrente="";

    for(let r of vinTable){
        if(vinNumber>=r.start && vinNumber<=r.end){
            modelloCorrente=r.modello.trim();
            break;
        }
    }

   if(!modelloCorrente){
    document.getElementById("risultatoVIN").innerText = "VIN non trovato nei range";
} else {
    const modelloMY = MODEL_MAP[modelloCorrente] || "Modello sconosciuto";
    document.getElementById("risultatoVIN").innerText =
        "Modello identificato: " + modelloCorrente + " (" + modelloMY + ")";


        /* GENERA NOME LISTA = VIN + data + ora */
        const now = new Date();
        const giorno = String(now.getDate()).padStart(2,"0");
        const mese = String(now.getMonth()+1).padStart(2,"0");
        const anno = now.getFullYear();
        const ore = String(now.getHours()).padStart(2,"0");
        const min = String(now.getMinutes()).padStart(2,"0");

        nomeLista = `VIN ${vinInput} – ${giorno}/${mese}/${anno} ${ore}:${min}`;
        document.getElementById("nomeListaLabel").textContent = nomeLista;
        salvaLista();
    }

    mostraRicambi();
}

/* ---------------- MODEL MAP ---------------- */
const MODEL_MAP={
    "Y01":"MY22",
    "Y0205":"MY2205",
    "Y0210":"MY23",
    "Y0230":"MY24"
};
/* Mappa inversa: da MYxx a codice interno Yxx */
const REVERSE_MODEL_MAP = {
    "MY22": "Y01",
    "MY2205": "Y0205",
    "MY23": "Y0210",
    "MY24": "Y0230"
};    

/* ---------------- COORDINATE DINAMICHE ---------------- */
async function caricaCoordinate(file){
    const modello = MODEL_MAP[modelloCorrente];
    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/coords/${modello}/${file}.json`;

    try{
        const r = await fetch(url);
        if(!r.ok) return {};
        return await r.json();
    }catch(e){
        return {};
    }
}

/* ---------------- SCELTA MODELLO PER RICAMBIO ---------------- */
function scegliModelloRicambio(codice, modelliStr){
    // modelliStr es: "MY22 MY23 MY24"
    const modelli = modelliStr.split(/\s+/).filter(m => m.length > 0);

    if(modelli.length === 0){
        alert("Nessun modello compatibile indicato per questo ricambio.");
        return;
    }

    // Se c'è un solo modello, apriamo direttamente
    if(modelli.length === 1){
        apriEsplosoPerModello(codice, modelli[0]);
        return;
    }

    // Popup scelta modello
    const existing = document.getElementById("popupModelli");
    if(existing) existing.remove();

    let html = `<div id="popupModelli" class="popupModelli">
        <h3>Apri esploso per ${codice}</h3>
        <p>Seleziona il modello:</p>`;

    modelli.forEach(m => {
        html += `<button onclick="apriEsplosoPerModello('${codice}', '${m}')">${m}</button>`;
    });

    html += `<button onclick="chiudiPopupModelli()">Chiudi</button></div>`;

    document.body.insertAdjacentHTML("beforeend", html);
}

function chiudiPopupModelli(){
    const p = document.getElementById("popupModelli");
    if(p) p.remove();
}

/* ---------------- APERTURA ESPLOSO PER MODELLO ---------------- */
function apriEsplosoPerModello(codice, modelloVisibile){
    // modelloVisibile es: "MY23"
    const codiceInterno = REVERSE_MODEL_MAP[modelloVisibile];
    if(!codiceInterno){
        alert("Modello non riconosciuto: " + modelloVisibile);
        return;
    }

    // scegli la tabella giusta
    let tabella = [];
    if(modelloVisibile === "MY22") tabella = partsTableMY22;
    else if(modelloVisibile === "MY2205") tabella = partsTableMY2205;
    else if(modelloVisibile === "MY23") tabella = partsTableMY23;
    else if(modelloVisibile === "MY24") tabella = partsTableMY24;

    const ricambio = tabella.find(p => p.codice === codice);
    if(!ricambio){
        alert("Ricambio " + codice + " non trovato nel catalogo " + modelloVisibile);
        chiudiPopupModelli();
        return;
    }

    // Impostiamo il modello corrente al codice interno (Y01, Y0210, ecc.)
    modelloCorrente = codiceInterno;

    // Apriamo l'esploso usando la tua funzione esistente
    mostraEsploso(ricambio.esploso, ricambio.codice, ricambio.id);

    chiudiPopupModelli();
}

/* ---------------- CERCHI + TOOLTIP + AGGIUNTA ALLA LISTA ---------------- */
async function inizializzaMiniaturaSinottico(sinottico){
    const coords = await caricaCoordinate(sinottico);
    if(!coords || !coords[sinottico]) return;

    const img = document.getElementById("img-"+sinottico);
    if(!img) return;

    const container = document.getElementById("box-"+sinottico);
    if(!container) return;

    const ricambi = partsTableMY22
        .concat(partsTableMY2205)
        .concat(partsTableMY23)
        .concat(partsTableMY24);

    function disegna(){
        const displayedW = img.clientWidth;
        const displayedH = img.clientHeight;

        Object.keys(coords[sinottico]).forEach(id=>{
            const ricambio = ricambi.find(r => r.esploso === sinottico && r.id == id);

            coords[sinottico][id].forEach(pt=>{
                const m = document.createElement("div");
                m.className = "markerMini";

                const tip = document.createElement("div");
                tip.className = "tooltip";
                tip.textContent = ricambio
                    ? (ricambio.codice + " – " + ricambio.descrizione)
                    : ("ID " + id);
                m.appendChild(tip);

                const add = document.createElement("div");
                add.className = "tooltipAdd";
                add.textContent = "➕ Aggiungi alla lista";
                add.onclick = (ev)=>{
                    ev.stopPropagation();
                    if(ricambio){
                        aggiungiALista(ricambio.codice, ricambio.descrizione, 1);
                    }
                };
                m.appendChild(add);

                m.onmouseenter = () => {
                    tip.style.opacity = 1;
                    add.style.opacity = 1;
                };
                m.onmouseleave = () => {
                    tip.style.opacity = 0;
                    add.style.opacity = 0;
                };

                m.style.left = (pt.x * displayedW) + "px";
                m.style.top  = (pt.y * displayedH) + "px";

                m.onclick = () => {
                    mostraEsploso(sinottico, ricambio ? ricambio.codice : sinottico, id);
                };

                container.appendChild(m);
            });
        });
    }

    if(img.complete){
        disegna();
    }else{
        img.onload = disegna;
    }
}
