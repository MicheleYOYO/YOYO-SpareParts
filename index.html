<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Catalogo Parti YOYO</title>
<style>
    body { font-family: Arial; margin: 20px; }
    #loginBox { max-width: 300px; margin: 100px auto; text-align: center; }
    #catalogo { display: none; }
    input { padding: 6px; width: 250px; margin: 5px 0; }
    button { padding: 6px 12px; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; }
    th { background: #eee; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
    <h2>Accesso Catalogo Parti</h2>
    <input type="password" id="pwd" placeholder="Inserisci password">
    <br>
    <button onclick="login()">Entra</button>
    <p id="msg" style="color:red;"></p>
</div>

<!-- CATALOGO -->
<div id="catalogo">
    <h2>Catalogo Parti YOYO</h2>

    <h3>Identificazione modello tramite VIN</h3>
    <input type="text" id="vinInput" maxlength="6" placeholder="Ultime 6 cifre VIN">
    <button onclick="identificaModello()">Identifica modello</button>
    <p id="modelInfo"></p>

    <h3>Ricerca per nome</h3>
    <input type="text" id="nomeInput" oninput="cercaPerNome()" placeholder="Nome parte (anche parziale)">

    <h3>Ricerca per codice</h3>
    <input type="text" id="codiceInput" oninput="cercaPerCodice()" placeholder="Codice parte (anche parziale)">

    <table id="risultatiTable">
        <thead>
            <tr>
                <th>Modello</th>
                <th>Esploso</th>
                <th>Rif</th>
                <th>Codice</th>
                <th>Nome</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// PASSWORD DI ACCESSO
const PASSWORD = "YOYO2024"; // puoi cambiarla

function login() {
    const pwd = document.getElementById("pwd").value;
    if (pwd === PASSWORD) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("catalogo").style.display = "block";
    } else {
        document.getElementById("msg").textContent = "Password errata";
    }
}

// DATI DI TEST (poi li sostituiremo con i CSV da OneDrive)
let vinTable = [
    { vin6: "123456", modello: "YOYO" },
    { vin6: "654321", modello: "YOYO PLUS" }
];

let catalogo = [
    { modello: "YOYO", esploso: "MOTORE_01", rif: "12", codice: "ABC123456", nome: "Filtro olio" },
    { modello: "YOYO", esploso: "MOTORE_01", rif: "13", codice: "ABC123457", nome: "Guarnizione filtro olio" },
    { modello: "YOYO PLUS", esploso: "FRENI_02", rif: "5", codice: "DEF987654", nome: "Pastiglia freno anteriore" }
];

let modelloCorrente = null;

// IDENTIFICA MODELLO
function identificaModello() {
    const vin = document.getElementById("vinInput").value.trim();
    const record = vinTable.find(r => r.vin6 === vin);
    const info = document.getElementById("modelInfo");

    if (record) {
        modelloCorrente = record.modello;
        info.textContent = "Modello identificato: " + modelloCorrente;
    } else {
        modelloCorrente = null;
        info.textContent = "VIN non trovato";
    }
    aggiornaRisultati([]);
}

// RICERCA PER NOME
function cercaPerNome() {
    if (!modelloCorrente) return;
    const t = document.getElementById("nomeInput").value.toLowerCase();
    const risultati = catalogo.filter(p =>
        p.modello === modelloCorrente && p.nome.toLowerCase().includes(t)
    );
    aggiornaRisultati(risultati);
}

// RICERCA PER CODICE
function cercaPerCodice() {
    if (!modelloCorrente) return;
    const t = document.getElementById("codiceInput").value.toLowerCase();
    const risultati = catalogo.filter(p =>
        p.modello === modelloCorrente && p.codice.toLowerCase().includes(t)
    );
    aggiornaRisultati(risultati);
}

// AGGIORNA TABELLA
function aggiornaRisultati(lista) {
    const tbody = document.querySelector("#risultatiTable tbody");
    tbody.innerHTML = "";
    lista.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${p.modello}</td>
            <td>${p.esploso}</td>
            <td>${p.rif}</td>
            <td>${p.codice}</td>
            <td>${p.nome}</td>
        `;
        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
