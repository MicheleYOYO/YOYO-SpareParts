<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>YOYO UNIQUE SPARE PARTS CATALOGUE</title>
<style>
body{font-family:Arial;margin:20px;}
input,button{padding:6px;font-size:16px;}
table{border-collapse:collapse;width:100%;margin-top:20px;}
th,td{border:1px solid #333;padding:8px;}
th{background:#eee;}
#partsBox table tr:hover td{background-color:#f0f0f0;}
#partsBox table tr:hover{cursor:pointer;}
</style>
</head>
<body>

<h1>YOYO UNIQUE SPARE PARTS CATALOGUE</h1>

<h2>Identificazione modello tramite VIN</h2>
<p>Inserisci le ultime 6 cifre del VIN:</p>
<input type="text" id="vinInput" maxlength="6">
<button onclick="identificaModello()">Identifica</button>
<p id="risultatoVIN" style="font-weight:bold;margin-top:10px;"></p>
<hr>

<h2>Ricerca ricambi</h2>
<input type="text" id="searchInput" placeholder="Cerca ricambio per codice o nome" oninput="mostraRicambi()">
<br><br>
<button onclick="mostraSinottici()">🔍 Ricerca visuale</button>
<button onclick="tornaAllaHome()">🏠 Torna alla pagina iniziale</button>
<hr>

<h2>Catalogo Ricambi</h2>
<div id="partsBox"></div>

<script>
// ---------------- VIN ----------------
let vinTable=[]; 
let modelloCorrente="";
const VIN_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/VIN.csv";

async function caricaVIN(){
    const r=await fetch(VIN_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);
    for(let i=1;i<righe.length;i++){
        const [start,end,modello]=righe[i].split(",");
        vinTable.push({
            start:parseInt(start.trim()),
            end:parseInt(end.trim()),
            modello:modello.trim()
        });
    }
}
caricaVIN();

function identificaModello(){
    const vinInput=document.getElementById("vinInput").value.trim();
    if(!vinInput){
        modelloCorrente="";
        document.getElementById("risultatoVIN").innerText="Inserisci un VIN valido";
        mostraRicambi();
        return;
    }
    const vinNumber=parseInt(vinInput);
    modelloCorrente="";
    for(let r of vinTable){
        if(vinNumber>=r.start && vinNumber<=r.end){
            modelloCorrente=r.modello.trim();
            break;
        }
    }
    if(!modelloCorrente){
        document.getElementById("risultatoVIN").innerText="VIN non trovato nei range";
    } else {
        document.getElementById("risultatoVIN").innerText="Modello identificato: "+modelloCorrente;
    }
    mostraRicambi();
}

// ---------------- PARTS GENERALE ----------------
let partsTable=[];
const PARTS_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/Parts.csv";

async function caricaParts(){
    const r=await fetch(PARTS_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const cols=righe[i].split(",");
        partsTable.push({
            codice:cols[0].trim(),
            descrizione:cols[1].trim(),
            quantita:cols[2].trim(),
            id:(cols[3]||"").trim(),
            modelli:(cols[4]||"").replace(/\*/g,"").trim().split(/\s+/).filter(m=>m.length>0),
            esploso:(cols[5]||"").trim()
        });
    }
    mostraRicambi();
}
caricaParts();

// ---------------- PARTS MY22 ----------------
let partsTableMY22=[];
const PARTS_MY22_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY22.csv";

async function caricaPartsMY22(){
    const r=await fetch(PARTS_MY22_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const cols=righe[i].split(",");
        partsTableMY22.push({
            codice:cols[0].trim(),
            descrizione:cols[1].trim(),
            quantita:cols[2].trim(),
            id:(cols[3]||"").trim(),
            modelli:["MY22"],
            esploso:(cols[4]||"").trim()
        });
    }
}
caricaPartsMY22();

// ---------------- PARTS MY2205 ----------------
let partsTableMY2205=[];
const PARTS_MY2205_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY2205.csv";

async function caricaPartsMY2205(){
    try{
        const r=await fetch(PARTS_MY2205_URL);
        if(!r.ok) return;
        const t=await r.text();
        const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

        for(let i=1;i<righe.length;i++){
            const cols=righe[i].split(",");
            partsTableMY2205.push({
                codice:cols[0].trim(),
                descrizione:cols[1].trim(),
                quantita:cols[2].trim(),
                id:(cols[3]||"").trim(),
                modelli:["MY2205"],
                esploso:(cols[4]||"").trim()
            });
        }
    }catch(e){}
}
caricaPartsMY2205();

// ---------------- PARTS MY23 ----------------
let partsTableMY23=[];
const PARTS_MY23_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY23.csv";

async function caricaPartsMY23(){
    const r=await fetch(PARTS_MY23_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const cols=righe[i].split(",");
        partsTableMY23.push({
            codice:cols[0].trim(),
            descrizione:cols[1].trim(),
            quantita:cols[2].trim(),
            id:(cols[3]||"").trim(),
            modelli:["MY23"],
            esploso:(cols[4]||"").trim()
        });
    }
}
caricaPartsMY23();

// ---------------- PARTS MY24 ----------------
let partsTableMY24=[];
const PARTS_MY24_URL="https://raw.githubusercontent.com/MicheleYOYO/YOYO-SpareParts/refs/heads/main/partsMY24.csv";

async function caricaPartsMY24(){
    const r=await fetch(PARTS_MY24_URL);
    const t=await r.text();
    const righe=t.split("\n").map(x=>x.trim()).filter(x=>x.length>0);

    for(let i=1;i<righe.length;i++){
        const cols=righe[i].split(",");
        partsTableMY24.push({
            codice:cols[0].trim(),
            descrizione:cols[1].trim(),
            quantita:cols[2].trim(),
            id:(cols[3]||"").trim(),
            modelli:["MY24"],
            esploso:(cols[4]||"").trim()
        });
    }
}
caricaPartsMY24();

// ---------------- MODEL MAP ----------------
const MODEL_MAP={
    "Y01":"MY22",
    "Y0205":"MY2205",
    "Y0210":"MY23",
    "Y0230":"MY24"
};

// ---------------- COORDINATE DINAMICHE ----------------
async function caricaCoordinate(file){
    const modello = MODEL_MAP[modelloCorrente];
    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/coords/${modello}/${file}.json`;

    try{
        const r = await fetch(url);
        if(!r.ok) return {};
        return await r.json();
    }catch(e){
        return {};
    }
}

// ---------------- MOSTRA RICAMBI ----------------
function mostraRicambi(){
    let search=(document.getElementById("searchInput")?.value||"").toLowerCase().trim();
    let html="<table><tr><th>Codice</th><th>Descrizione</th><th>Quantità</th><th>Modelli compatibili</th></tr>";

    let tabella=partsTable;
    if(modelloCorrente==="Y01") tabella=partsTableMY22;
    else if(modelloCorrente==="Y0205") tabella=partsTableMY2205;
    else if(modelloCorrente==="Y0210") tabella=partsTableMY23;
    else if(modelloCorrente==="Y0230") tabella=partsTableMY24;

    const filtrati=tabella.filter(p=>{
        if(search.length>0){
            const codice=p.codice.toLowerCase();
            const descrizione=p.descrizione.toLowerCase();
            if(!codice.includes(search) && !descrizione.includes(search)) return false;
        }
        return true;
    });

    filtrati.forEach(p=>{
        html+=`
        <tr onclick="mostraEsploso('${p.esploso}','${p.codice}','${p.id}')">
            <td>${p.codice}</td>
            <td>${p.descrizione}</td>
            <td>${p.quantita}</td>
            <td>${p.modelli.join(", ")}</td>
        </tr>`;
    });

    if(filtrati.length===0){
        html+="<tr><td colspan='4'>Nessun ricambio trovato</td></tr>";
    }

    html+="</table>";
    document.getElementById("partsBox").innerHTML=html;
}

// ---------------- RICERCA VISUALE ----------------
function mostraSinottici(){
    if(!modelloCorrente){
        let html=`
        <h3>Seleziona il modello per la ricerca visuale</h3>
        <button onclick="selezionaModelloVisuale('Y01')" style="padding:10px;font-size:18px;margin-right:20px;">MY22</button>
        <button onclick="selezionaModelloVisuale('Y0205')" style="padding:10px;font-size:18px;margin-right:20px;">MY2205</button>
        <button onclick="selezionaModelloVisuale('Y0210')" style="padding:10px;font-size:18px;margin-right:20px;">MY23</button>
        <button onclick="selezionaModelloVisuale('Y0230')" style="padding:10px;font-size:18px;">MY24</button>`;
        document.getElementById("partsBox").innerHTML=html;
        return;
    }
    mostraSinotticiPerModello(modelloCorrente);
}

function selezionaModelloVisuale(modello){
    modelloCorrente=modello;
    mostraSinotticiPerModello(modelloCorrente);
}

function mostraSinotticiPerModello(modello){
    let tabella=[];
    if(modello==="Y01") tabella=partsTableMY22;
    else if(modello==="Y0205") tabella=partsTableMY2205;
    else if(modello==="Y0210") tabella=partsTableMY23;
    else if(modello==="Y0230") tabella=partsTableMY24;

    const sinottici=[...new Set(tabella.map(p=>p.esploso).filter(x=>x))];

    let html="<h3>Seleziona un sinottico</h3>";
    html+="<div style='display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;'>";

    sinottici.forEach(s=>{
        html+=`
        <div onclick="mostraEsploso('${s}','${s}',null)" 
             style="border:1px solid #333;padding:15px;width:48%;text-align:center;cursor:pointer;">
            <img src="https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${MODEL_MAP[modello]}/${s}.jpg"
                 style="width:100%;height:auto;">
            <div style="margin-top:10px;font-weight:bold;font-size:22px;">${s}</div>
        </div>`;
    });

    html+="</div>";
    document.getElementById("partsBox").innerHTML=html;
}

// ---------------- RICAMBI DI UN SINOTTICO ----------------
function mostraRicambiSinottico(codiceEsploso, evidenziaId = null){
    let tabella=[];
    if(modelloCorrente==="Y01") tabella=partsTableMY22;
    else if(modelloCorrente==="Y0205") tabella=partsTableMY2205;
    else if(modelloCorrente==="Y0210") tabella=partsTableMY23;
    else if(modelloCorrente==="Y0230") tabella=partsTableMY24;

    const ricambi = tabella.filter(p=>p.esploso===codiceEsploso);

    let html = `
        <button onclick="mostraEsploso('${codiceEsploso}', '${codiceEsploso}', null)"
                style="padding:10px 20px;font-size:18px;margin-bottom:10px;">
            🔙 Torna al sinottico
        </button>

        <button onclick="tornaAGrigliaSinottici()"
                style="padding:10px 20px;font-size:18px;margin-left:10px;margin-bottom:20px;">
            🗂️ Torna alla griglia sinottici
        </button>
        <button onclick="stampaRicambi('${codiceEsploso}')"
        style="padding:10px 20px;font-size:18px;margin-left:10px;margin-bottom:20px;">
    🖨️ Stampa ricambi
</button>


        <h2>Ricambi del sinottico ${codiceEsploso}</h2>
    `;

    html += "<table><tr><th>Codice</th><th>Descrizione</th><th>Quantità</th></tr>";

    ricambi.forEach(p=>{
        html += `
        <tr data-id="${p.id}" onclick="mostraEsploso('${p.esploso}','${p.codice}','${p.id}')">
            <td>${p.codice}</td>
            <td>${p.descrizione}</td>
            <td>${p.quantita}</td>
        </tr>`;
    });

    html += "</table>";
    document.getElementById("partsBox").innerHTML = html;

    if(evidenziaId){
        setTimeout(()=>{
            const righe=document.querySelectorAll("#partsBox table tr");
            righe.forEach(r=>{
                if(r.getAttribute("data-id")===evidenziaId){
                    r.style.background="#ffff66";
                    r.scrollIntoView({behavior:"smooth",block:"center"});
                }
            });
        },200);
    }
}



// ---------------- MOSTRA ESPLOSO ----------------
async function mostraEsploso(file, codice, idRicambio){
    if(!file){
        alert("Nessun esploso disponibile");
        return;
    }

    const coords = await caricaCoordinate(file);
    const cartella = MODEL_MAP[modelloCorrente];
    const url = `https://micheleyoyo.github.io/YOYO-SpareParts/esplosi/${cartella}/${file}.jpg`;

    const win = window.open("", "_blank");
    window.explodedWin = win;

    win.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>${codice}</title>
<style>
body{
    margin:0;
    padding:20px;
    background:#000;
    font-family:Arial;
}
#container{
    position:relative;
    display:inline-block;
}
#explodedImg{
    width:60%;
    height:auto;
    display:block;
}
.marker{
    position:absolute;
    width:25px;
    height:25px;
    background:rgba(255,255,0,0);
    border:2px solid rgba(0,0,0,0);
    border-radius:50%;
    transform:translate(-50%,-50%);
    cursor:pointer;
    transition:0.2s;
}
.marker:hover{
    background:rgba(255,255,0,0.4);
    border:2px solid rgba(0,0,0,0.6);
}

/* Tooltip */
.tooltip{
    position:absolute;
    background:#333;
    color:#fff;
    padding:6px 10px;
    border-radius:5px;
    font-size:14px;
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    top:-10px;
    left:50%;
    transform:translate(-50%, -100%);
    transition:opacity 0.15s;
    max-width:250px;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>
</head>

<body>

<div id="container">
    <img id="explodedImg" src="${url}">
</div>

<script>
const coords = ${JSON.stringify(coords)};
const fileName = "${file}".replace(/\\.[^/.]+$/, "");

const img = document.getElementById("explodedImg");
const container = document.getElementById("container");

const ricambi = ${JSON.stringify(
    partsTableMY22
        .concat(partsTableMY2205)
        .concat(partsTableMY23)
        .concat(partsTableMY24)
)};

img.onload = function(){
    const displayedW = img.clientWidth;
    const displayedH = img.clientHeight;

    if(coords[fileName]){
        Object.keys(coords[fileName]).forEach(id=>{
            
            const ricambio = ricambi.find(r => r.esploso === fileName && r.id == id);

            coords[fileName][id].forEach(pt=>{
                const m = document.createElement("div");
                m.className = "marker";

                // Tooltip
                const tip = document.createElement("div");
                tip.className = "tooltip";
                tip.textContent = ricambio 
                    ? (ricambio.codice + " – " + ricambio.descrizione)
                    : ("ID " + id);
                m.appendChild(tip);

                // Tooltip intelligente (non esce dai bordi)
                m.onmouseenter = () => {
                    tip.style.opacity = 1;

                    const rect = tip.getBoundingClientRect();
                    const winW = window.innerWidth;

                    if(rect.left < 0){
                        tip.style.left = "0px";
                        tip.style.transform = "translate(0, -100%)";
                    }
                    else if(rect.right > winW){
                        tip.style.left = "100%";
                        tip.style.transform = "translate(-100%, -100%)";
                    }
                };

                m.onmouseleave = () => {
                    tip.style.opacity = 0;
                    tip.style.left = "50%";
                    tip.style.transform = "translate(-50%, -100%)";
                };

                // Posizione marker
                m.style.left = (pt.x * displayedW) + "px";
                m.style.top  = (pt.y * displayedH) + "px";

                // Click → torna alla lista ricambi
                m.onclick = () => {
                    if(window.opener && !window.opener.closed){
                        window.opener.mostraRicambiSinottico(fileName, id);
                    }
                    window.close();
                };

                container.appendChild(m);
            });
        });
    }
};
<\/script>

</body>
</html>
`);
}

function tornaAGrigliaSinottici(){
    // Torna alla griglia sinottici
    mostraSinotticiPerModello(modelloCorrente);

    // Chiude la finestra dell’esploso se ancora aperta
    if(window.explodedWin && !window.explodedWin.closed){
        window.explodedWin.close();
    }
}
function stampaRicambi(codiceEsploso){
    let tabella=[];
    if(modelloCorrente==="Y01") tabella=partsTableMY22;
    else if(modelloCorrente==="Y0205") tabella=partsTableMY2205;
    else if(modelloCorrente==="Y0210") tabella=partsTableMY23;
    else if(modelloCorrente==="Y0230") tabella=partsTableMY24;

    const ricambi = tabella.filter(p=>p.esploso===codiceEsploso);

    let html = `
        <html>
        <head>
            <title>Ricambi ${codiceEsploso}</title>
            <style>
                body{ font-family:Arial; padding:20px; }
                h2{ margin-bottom:20px; }
                table{ width:100%; border-collapse:collapse; }
                th,td{ border:1px solid #333; padding:8px; }
                th{ background:#eee; }
            </style>
        </head>
        <body>
            <h2>Ricambi del sinottico ${codiceEsploso}</h2>
            <table>
                <tr>
                    <th>Codice</th>
                    <th>Descrizione</th>
                    <th>Quantità</th>
                </tr>
    `;

    ricambi.forEach(p=>{
        html += `
            <tr>
                <td>${p.codice}</td>
                <td>${p.descrizione}</td>
                <td>${p.quantita}</td>
            </tr>
        `;
    });

    html += `
            </table>
        </body>
        </html>
    `;

    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
    win.print();
}


// ---------------- HOME ----------------
function tornaAllaHome(){
    document.getElementById("vinInput").value="";
    document.getElementById("searchInput").value="";
    modelloCorrente="";
    document.getElementById("risultatoVIN").innerText="";
    mostraRicambi();
}

</script>

</body>
</html>
