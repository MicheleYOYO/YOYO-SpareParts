<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>YOYO UNIQUE SPARE PARTS CATALOGUE</title>
<style>
    body { font-family: Arial; margin: 20px; }
    .hidden { display: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
</style>
</head>

<body>

<h2>YOYO UNIQUE SPARE PARTS CATALOGUE</h2>

<!-- LOGIN -->
<div id="loginBox">
    <p>Inserisci la password per accedere:</p>
    <input type="password" id="pwd">
    <button onclick="checkPwd()">Entra</button>
    <p id="pwdMsg" style="color:red;"></p>
</div>

<!-- CONTENUTO PRINCIPALE -->
<div id="main" class="hidden">

    <h3>Identificazione modello tramite VIN</h3>
    <p>Inserisci le ultime 6 cifre del VIN:</p>
    <input type="text" id="vinInput" maxlength="6">
    <button onclick="identificaModello()">Identifica</button>
    <p id="modelInfo" style="font-weight:bold;"></p>

    <hr>

    <h3>Catalogo ricambi</h3>
    <p>(In attesa del file catalogo.csv)</p>

</div>

<script>
// ------------------------------
// PASSWORD DI ACCESSO
// ------------------------------
const PASSWORD = "YOYO2024";

function checkPwd() {
    const p = document.getElementById("pwd").value;
    if (p === PASSWORD) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("main").classList.remove("hidden");
    } else {
        document.getElementById("pwdMsg").textContent = "Password errata";
    }
}

// ------------------------------
// CARICAMENTO VIN.csv DA ONEDRIVE
// ------------------------------
let vinTable = [];

const VIN_URL = "https://xevglobaleu-my.sharepoint.com/:x:/g/personal/cloud_xev-global_eu/IQCBOm05PfeySKjXBJjqcMFjAXE2biGFMNnOhNDwYN2bK6o?e=DHEWJT";

async function caricaVIN() {
    try {
        const response = await fetch(VIN_URL);
        const text = await response.text();

        const righe = text.split("\n").map(r => r.trim()).filter(r => r.length > 0);

        for (let i = 1; i < righe.length; i++) {
            const [start, end, modello] = righe[i].split(",");

            vinTable.push({
                start: parseInt(start),
                end: parseInt(end),
                modello: modello.trim()
            });
        }

        console.log("VIN.csv caricato:", vinTable);

    } catch (e) {
        console.error("Errore nel caricamento VIN.csv:", e);
    }
}

caricaVIN();

// ------------------------------
// IDENTIFICAZIONE MODELLO
// ------------------------------
let modelloCorrente = null;

function identificaModello() {
    const vinInput = document.getElementById("vinInput").value.trim();

    if (vinInput.length !== 6 || isNaN(vinInput)) {
        document.getElementById("modelInfo").textContent = "Inserisci 6 cifre numeriche";
        return;
    }

    const vinNumber = parseInt(vinInput);

    const record = vinTable.find(r =>
        vinNumber >= r.start && vinNumber <= r.end
    );

    if (record) {
        modelloCorrente = record.modello;
        document.getElementById("modelInfo").textContent =
            "Modello identificato: " + modelloCorrente;
    } else {
        modelloCorrente = null;
        document.getElementById("modelInfo").textContent =
            "VIN non trovato nei range";
    }
}

</script>

</body>
</html>
