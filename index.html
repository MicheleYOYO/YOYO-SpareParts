<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>YOYO Spare Parts</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        tr:hover { background: #eef; cursor: pointer; }
        #explodedView img { max-width: 100%; border: 1px solid #333; padding: 10px; }
    </style>
</head>

<body>

<h2>Catalogo Ricambi YOYO</h2>

<label>Inserisci VIN:</label>
<input type="text" id="vinInput">
<button onclick="cercaVIN()">Cerca</button>

<div id="vinResult"></div>
<div id="partsBox"></div>
<div id="explodedView" style="margin-top:20px;"></div>

<script>
let partsTable = [];
let modelloCorrente = "";

/* ------------------------------
   1. CARICAMENTO PARTS.CSV
--------------------------------*/
fetch("Parts.csv")
    .then(res => res.text())
    .then(text => {
        const righe = text.split("\n").slice(1); // salta intestazione

        partsTable = righe
            .map(r => r.trim())
            .filter(r => r.length > 0)
            .map(r => {
                const campi = r.split(",");

                return {
                    codice: campi[0],
                    descrizione: campi[1],
                    quantita: campi[2],
                    modello: campi[3],
                    esploso: campi[4] ? campi[4].trim() : ""
                };
            });
    });

/* ------------------------------
   2. CERCA VIN → TROVA MODELLO
--------------------------------*/
function cercaVIN() {
    const vin = document.getElementById("vinInput").value.trim().toUpperCase();

    if (vin.length < 4) {
        document.getElementById("vinResult").innerHTML = "<p>VIN non valido.</p>";
        return;
    }

    // Ultime 2 cifre = modello MYxx
    modelloCorrente = "MY" + vin.slice(-2);

    document.getElementById("vinResult").innerHTML =
        `<p>Modello rilevato: <b>${modelloCorrente}</b></p>`;

    mostraRicambi();
}

/* ------------------------------
   3. MOSTRA RICAMBI DEL MODELLO
--------------------------------*/
function mostraRicambi() {

    // Normalizza e supporta MY22|MY22.5 oppure * MY22 MY22.5 *
    const lista = partsTable.filter(p =>
        p.modello
            .replace(/\*/g, "")     // rimuove asterischi
            .replace(/\s+/g, " ")   // normalizza spazi
            .split("|")             // supporta MY22|MY22.5
            .includes(modelloCorrente)
    );

    if (lista.length === 0) {
        document.getElementById("partsBox").innerHTML =
            "<p>Nessun ricambio trovato per questo modello.</p>";
        return;
    }

    let html = "<table><tr><th>Codice</th><th>Descrizione</th><th>Q.tà</th><th>Modello</th></tr>";

    lista.forEach(p => {
        html += `
            <tr onclick="mostraEsploso('${p.esploso}', '${p.codice}')">
                <td>${p.codice}</td>
                <td>${p.descrizione}</td>
                <td>${p.quantita}</td>
                <td>${p.modello}</td>
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("partsBox").innerHTML = html;
}

/* ------------------------------
   4. MOSTRA ESPLOSO
--------------------------------*/
function mostraEsploso(file, codice) {

    if (!file) {
        document.getElementById("explodedView").innerHTML =
            "<p>Nessun esploso disponibile per questo ricambio.</p>";
        return;
    }

    const percorso = `esplosi/${file}.png`;

    document.getElementById("explodedView").innerHTML = `
        <h3>Esploso del ricambio: ${codice}</h3>
        <img src="${percorso}">
    `;

    evidenziaRiga(codice);
}

/* ------------------------------
   5. EVIDENZIA RIGA SELEZIONATA
--------------------------------*/
function evidenziaRiga(codice) {
    const righe = document.querySelectorAll("#partsBox table tr");

    righe.forEach(r => r.style.background = "white");

    righe.forEach(r => {
        if (r.innerText.includes(codice)) {
            r.style.background = "#ffff99";
        }
    });
}
</script>

</body>
</html>
